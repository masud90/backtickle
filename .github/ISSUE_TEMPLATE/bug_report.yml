name: Bug report
description: Something in Writedown doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If a document renders wrong, the **Rendering problem** form is a better fit.
        Please report security problems privately, as described in [SECURITY.md](https://github.com/masud90/writedown/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
      placeholder: |
        1. Open two files from Finder
        2. Close the first tab
        3. The other tab shows an empty document
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Writedown version
      description: From About Writedown (Writedown menu on macOS, Help menu on Windows and Linux).
      placeholder: "0.1.2"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: System version
      placeholder: "macOS 15.4, Windows 11 24H2, Ubuntu 24.04 ..."
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the settings involved (auto-save, Live Preview, Exact Preview), or a small file that shows the problem.
