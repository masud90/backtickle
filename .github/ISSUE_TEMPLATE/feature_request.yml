name: Feature request
description: An idea that would make Writedown better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/masud90/writedown/blob/main/ROADMAP.md) first: if your idea is already there, a comment on its issue helps more than a new one.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, in your own words. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Mention another app if it does this well.
  - type: checkboxes
    id: principles
    attributes:
      label: Writedown's principles
      description: Writedown never runs anything in a document and makes no network requests of its own.
      options:
        - label: This idea works within those principles, as far as I can tell.
