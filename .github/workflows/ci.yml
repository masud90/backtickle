name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/gen-large-doc.mjs --size 100k
      - run: npm run check
      - run: npm run build # the Rust crate embeds the built frontend
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run test:rust

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF line endings, as on macOS: the formatter and the fixtures expect them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/gen-large-doc.mjs --size 100k
      - run: npm run check
      - run: npm run build # the Rust crate embeds the built frontend
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run test:rust
      # The installers, so a change that breaks bundling shows here and a build can be tried.
      - run: npm run build:app:windows
      - uses: actions/upload-artifact@v4
        with:
          name: backtickle-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

  linux:
    # The oldest supported runner, so the AppImage runs on systems with an older C library too.
    runs-on: ubuntu-22.04
    steps:
      - name: Install the libraries the web view is made of
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/gen-large-doc.mjs --size 100k
      - run: npm run check
      - run: npm run build # the Rust crate embeds the built frontend
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run test:rust
      # The packages, so a change that breaks bundling shows here and a build can be tried.
      - run: npm run build:app:linux
      - name: List the sources of the libraries in the AppImage
        run: for file in src-tauri/target/release/bundle/appimage/*.AppImage; do bash scripts/appimage-sources.sh "$file"; done
      - uses: actions/upload-artifact@v4
        with:
          name: backtickle-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sources.txt
          retention-days: 14
