name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/gen-large-doc.mjs --size 100k
      - run: npm run check
      - run: npm run build # the Rust crate embeds the built frontend
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run test:rust
