name: Temporary list code scanning alerts
on:
  push:
    branches: [claude/fix-codeql-alerts-vra9f7]
permissions:
  security-events: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" \
            --jq '.[] | "ALERT \(.number) | \(.rule.id) | \(.rule.security_severity_level // .rule.severity) | \(.most_recent_instance.category) | \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)-\(.most_recent_instance.location.end_line) | \(.most_recent_instance.message.text)"'
